font=JetBrainsMono Nerd Font Mono:size=12:weight=extrabold
dpi-aware=yes
use-bold=yes
prompt="Pick: "
icon-theme=Papirus
icons-enabled=yes
hide-before-typing=no
fields=filename,name,generic,exec
sort-result=yes
match-counter=yes
show-actions=no
terminal=foot
anchor=center
x-margin=15
y-margin=15
lines=8
width=40
tabs=2
horizontal-pad=20
vertical-pad=20
inner-pad=13
line-height=20
layer=overlay
exit-on-keyboard-focus-loss=yes
cache=/dev/null

[colors]
background=222222ff
text=fff4d2ff
prompt=d8a657ff
placeholder=93a1a1ff
input=ea6962ff
match=b22222ff
selection=d8a657ff
selection-text=222222ff
selection-match=b22222ff
counter=fabd2fff
border=d8a657ff

[border]
width=3
radius=0


[key-bindings]
next=none
prev=none
next-with-wrap=Control+n
prev-with-wrap=Control+p
